[common]
# 多服务端穿透：server_addr 支持用逗号（或空格）分隔多个服务端地址，
# 客户端会为每个服务端单独注册下面的 host / tunnel，并各自独立断线重连。
# 例：server_addr=a.example.com:8024,b.example.com:8024
server_addr=127.0.0.1:8024
# conn_type 与服务端 bridge_type 必须一致：tcp / kcp / tls
# tls 表示客户端到服务端的控制通道走 TLS（服务端自签证书默认不校验，可用 tls_verify 打开校验）
conn_type=tcp
#tls_verify=true
vkey=123
auto_reconnection=true
max_conn=1000
flow_limit=1000
rate_limit=1000
basic_username=11
basic_password=3
web_username=user
web_password=1234
crypt=true
compress=true
#pprof_addr=0.0.0.0:9999
disconnect_timeout=60

[health_check_test1]
health_check_timeout=1
health_check_max_failed=3
health_check_interval=1
health_http_url=/
health_check_type=http
health_check_target=127.0.0.1:8083,127.0.0.1:8082

[health_check_test2]
health_check_timeout=1
health_check_max_failed=3
health_check_interval=1
health_check_type=tcp
health_check_target=127.0.0.1:8083,127.0.0.1:8082

[web]
host=c.o.com
target_addr=127.0.0.1:8083,127.0.0.1:8082

[tcp]
mode=tcp
target_addr=127.0.0.1:8080
server_port=10000
# 隧道端口的 Basic 认证与 TLS（在 nps 后台的隧道配置里也可单独设置）
# 开启后访问者必须带 Basic 凭据（HTTP CONNECT / AUTH Basic），未通过认证的连接不会转发到内网
#auth_user=visitor
#auth_pass=change-me
#tls=true

[socks5]
mode=socks5
server_port=19009
multi_account=multi_account.conf

[file]
