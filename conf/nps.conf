appname = nps
#Boot mode(dev|pro)
runmode = dev

#HTTP(S) proxy port, no startup if empty
http_proxy_ip=0.0.0.0
http_proxy_port=80
https_proxy_port=443
https_just_proxy=true
#default https certificate setting
https_default_cert_file=conf/server.pem
https_default_key_file=conf/server.key

##bridge
#bridge_type: tcp / kcp / tls. tls means the client-server control channel is wrapped by TLS.
#The certificate comes from bridge_cert_file / bridge_key_file, otherwise the built-in self-signed one is used.
bridge_type=tcp
bridge_port=8024
bridge_ip=0.0.0.0
#bridge_cert_file=conf/server.pem
#bridge_key_file=conf/server.key

# Public password, which clients can use to connect to the server
# After the connection, the server will be able to open relevant ports and parse related domain names according to its own configuration file.
public_vkey=123

#Traffic data persistence interval(minute)
#Ignorance means no persistence
#flow_store_interval=1

# log level LevelEmergency->0  LevelAlert->1 LevelCritical->2 LevelError->3 LevelWarning->4 LevelNotice->5 LevelInformational->6 LevelDebug->7
log_level=7
#log_path=nps.log

#Whether to restrict IP access, true or false or ignore
#ip_limit=true

#p2p
#p2p_ip=127.0.0.1
#p2p_port=6000

#web
web_host=a.o.com
web_username=admin
web_password=123
web_port = 8080
web_ip=0.0.0.0
web_base_url=
web_open_ssl=false
web_cert_file=conf/server.pem
web_key_file=conf/server.key
# if web under proxy use sub path. like http://host/nps need this.
#web_base_url=/nps

#Web API unauthenticated IP address(the len of auth_crypt_key must be 16)
#Remove comments if needed
#auth_key=test
auth_crypt_key =1234567812345678

#allow_ports=9001-9009,10001,11000-12000

#Trusted source address filter for tunnels. The tunnel's own config overrides these.
#Sources outside allow_ip are closed before any handshake, so port scanners never
#reach the real service (important for 3389: brute force attempts lock accounts).
#Format: single ip, CIDR or prefix wildcard, separated by comma.
#allow_ip=1.2.3.4,10.0.0.0/8,192.168.1.*
#deny_ip=8.8.8.8

#Per source ip connection rate limit: at most N new connections per window,
#the source is banned for tunnel_ban_seconds once exceeded. Ignore = no limit.
#tunnel_conn_rate=10
#tunnel_conn_window=1
#tunnel_ban_seconds=600

#High risk ports (21,22,23,135,139,445,1433,1521,3306,3389,5432,5900,5985,6379,27017)
#get a default connection rate limit even when tunnel_conn_rate is empty, so public
#brute force scripts cannot keep trying passwords against RDP/SSH and lock accounts.
#Normal use (reconnect, several RDP windows) never reaches this rate.
#risky_port_guard=true
#risky_port_conn_rate=4

#Public address of this server. Only used when the server has to tell a client
#its own address. Leave empty: nps no longer asks third-party services for it.
#external_ip=

#Wait for the first application byte before opening a tunnel on well known ports
#(3389 rdp, 22 ssh, 80/443 http, 5900 vnc, 3306 mysql ...). Clients of these
#protocols speak first, so a connection that stays silent is a port scanner or a
#fingerprint probe: it is closed before the tunnel is built, which saves a client
#connection slot and keeps the real service hidden. FTP (20/21) is skipped on
#purpose because its server speaks first. Set to 0 to disable.
#first_byte_timeout=15

#Web management multi-user login
allow_user_login=false
allow_user_register=false
allow_user_change_username=false


#extension
allow_flow_limit=false
allow_rate_limit=false
allow_tunnel_num_limit=false
allow_local_proxy=false
allow_connection_num_limit=false
allow_multi_ip=false
system_info_display=false

#cache
http_cache=false
http_cache_length=100

#get origin ip
http_add_origin_header=false

#pprof debug options
#pprof_ip=0.0.0.0
#pprof_port=9999

#client disconnect timeout
disconnect_timeout=60

#FTP data channel. A tunnel to port 21 (mode=ftp, or a tcp tunnel whose target is
#21) rewrites the address inside PASV/EPSV and PORT/EPRT, so both passive and
#active mode transfer through the tunnel. The advertised address comes from
#ftp_public_ip, then external_ip, then the local address of the control
#connection -- set one of them explicitly when the server is behind NAT.
#ftp_public_ip=
#Relay ports for the data channels. Random ephemeral ports also work, but only if
#the security group / firewall lets them through, so pin the ranges and open them:
#ftp_pasv_ports=40000-40050
#ftp_active_ports=40100-40150
#How long a relay port waits for its data connection before it is released.
#ftp_relay_timeout=60
#auto (default): tcp tunnels to port 21 get the FTP rewrite automatically,
#off: only mode=ftp tunnels are rewritten.
#ftp_alg=auto
