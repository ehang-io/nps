name: Release

# Pushing a release tag is the whole release: this builds, tests and creates
# the GitHub release with its assets. Nothing is clicked in the web UI, and a
# release never exists without binaries, since it is only created at the end.
on:
  push:
    tags:
      - 'v*-hz*'

permissions:
  contents: write

# This replaces the 2021 pipeline, which built thirty-three targets plus an
# Android APK, a Synology package and DockerHub images. Its jobs were pinned to
# action versions current runners no longer execute, and the image jobs need
# DockerHub secrets this fork does not have. What remains is what the fleet
# actually consumes: Linux client and server binaries, and the checksum file
# that makes a curl-driven update verifiable. The old pipeline is in git
# history if a platform is ever needed back.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Taken from the go directive so the toolchain cannot drift away
          # from what the dependencies require.
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go vet ./lib/selfupdate/...
          # -short, because upstream's mux tests drive docker containers on a
          # fixed subnet and a few others time out even against pristine
          # upstream sources. They are skipped rather than removed so they
          # stay available to run by hand.
          cd nps-mux && go test -short -race ./...
          # The end-to-end mux tests skip themselves under -race: closing a
          # mux races on close flags upstream never synchronised.
          go test -short ./...

      # Deliberately non-blocking. A stale version number in the docs is worth
      # knowing about immediately, but not worth withholding a release whose
      # tag is already pushed, which would then have to be deleted and pushed
      # again.
      - name: Docs point at this release
        continue-on-error: true
        run: |
          missing=0
          for f in deploy/docker/README.md; do
            grep -q "$GITHUB_REF_NAME" "$f" || {
              echo "::warning file=$f::still points at another release; run deploy/bump-version.sh $GITHUB_REF_NAME before tagging"
              missing=1
            }
          done
          exit $missing

      - name: Build
        run: |
          chmod +x build.release.sh
          ./build.release.sh "${GITHUB_REF_NAME}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # update.sh rides along so the install one-liner can take it from
          # releases/latest/download: always current, and fixed per release
          # rather than tracking a branch.
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
            deploy/update.sh
